<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background: dark navy rounded square -->
  <rect width="100" height="100" rx="20" fill="#0f1729"/>

  <!-- Brand mark: 6 vertical bars matching the Royal Clean logo, in brand blue -->
  <!-- Outer left -->
  <rect x="8"  y="28" width="11" height="52" rx="5.5" fill="#4970B6"/>
  <!-- Inner left tall -->
  <rect x="23" y="16" width="11" height="66" rx="5.5" fill="#4970B6"/>
  <!-- Center-left -->
  <rect x="38" y="22" width="11" height="58" rx="5.5" fill="#6087cc"/>
  <!-- Center-right -->
  <rect x="51" y="22" width="11" height="58" rx="5.5" fill="#6087cc"/>
  <!-- Inner right tall -->
  <rect x="66" y="16" width="11" height="66" rx="5.5" fill="#4970B6"/>
  <!-- Outer right -->
  <rect x="81" y="28" width="11" height="52" rx="5.5" fill="#4970B6"/>

  <!-- Base connector (squeegee blade) -->
  <rect x="8" y="82" width="84" height="9" rx="4.5" fill="#4970B6"/>
</svg>
